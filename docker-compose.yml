services:
  chatflow-api:
    profiles: [app]
    build:
      context: .
      network: ${CHATFLOW_BUILD_NETWORK:-host}
    image: chatflow:local
    command: ["api"]
    environment:
      DATABASE_URL: postgres://chatflow:chatflow@postgres:5432/chatflow
      API_BIND: 0.0.0.0:3000
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow-cpu:9380}
      RAGFLOW_API_KEY_FILE: /run/secrets/ragflow_api_key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MODEL_INPUT_USD_PER_MILLION: ${MODEL_INPUT_USD_PER_MILLION:-}
      MODEL_OUTPUT_USD_PER_MILLION: ${MODEL_OUTPUT_USD_PER_MILLION:-}
      CHATFLOW_LOCAL_DOCKER_HTTP: "true"
    secrets:
      - ragflow_api_key
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default
      - ragflow_link
    ports:
      - "127.0.0.1:${CHATFLOW_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  chatflow-worker:
    profiles: [app]
    build:
      context: .
      network: ${CHATFLOW_BUILD_NETWORK:-host}
    image: chatflow:local
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://chatflow:chatflow@postgres:5432/chatflow
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow-cpu:9380}
      RAGFLOW_API_KEY_FILE: /run/secrets/ragflow_api_key
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-local-dev-only}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      CHATFLOW_LOCAL_DOCKER_HTTP: "true"
    secrets:
      - ragflow_api_key
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default
      - ragflow_link
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      otel-collector:
        condition: service_started

  vault:
    image: hashicorp/vault:1.21.0
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-local-dev-only}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    command: ["server", "-dev"]
    ports:
      - "127.0.0.1:${CHATFLOW_VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chatflow
      POSTGRES_PASSWORD: chatflow
      POSTGRES_DB: chatflow
    ports:
      - "127.0.0.1:${CHATFLOW_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatflow -d chatflow"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${CHATFLOW_OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${CHATFLOW_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${CHATFLOW_OTEL_METRICS_PORT:-9464}:9464"
    depends_on:
      - jaeger

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:${CHATFLOW_JAEGER_PORT:-16686}:16686"

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${CHATFLOW_OPS_API_KEY_FILE:-./.local/ops-api-key}:/etc/prometheus/ops-api-key:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${CHATFLOW_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-only}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana-dashboard.json:/var/lib/grafana/dashboards/chatflow.json:ro
    ports:
      - "127.0.0.1:${CHATFLOW_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  ragflow_link:
    external: true
    name: ${CHATFLOW_RAGFLOW_NETWORK:-chatflow-ragflow-link}

secrets:
  ragflow_api_key:
    file: ${CHATFLOW_RAGFLOW_API_KEY_FILE:-./.local/ragflow-api-key}
