[package]
name = "chatflow"
version = "0.1.0"
edition = "2021"

[lib]
name = "chatflow"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
petgraph = "0.8"
rand = "0.8"
reqwest = { version = "0.13", features = ["json"] }
rig-core = "0.42"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "grpc-tonic"] }

[dev-dependencies]
serde_json = "1"
