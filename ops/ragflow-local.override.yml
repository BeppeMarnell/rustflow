services:
  tei-cpu:
    ports: !override
      - 127.0.0.1:${RAGFLOW_TEI_PORT:-6380}:80
  ragflow-cpu:
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
    networks:
      - ragflow
      - chatflow_link
    ports: !override
      - 127.0.0.1:${RAGFLOW_WEB_PORT:-18080}:80
      - 127.0.0.1:${RAGFLOW_HTTPS_PORT:-18443}:443
      - 127.0.0.1:${RAGFLOW_API_PORT:-9380}:9380
      - 127.0.0.1:${RAGFLOW_ADMIN_PORT:-9381}:9381
      - 127.0.0.1:${RAGFLOW_MCP_PORT:-9382}:9382
      - 127.0.0.1:${RAGFLOW_GO_HTTP_PORT:-9384}:9384
      - 127.0.0.1:${RAGFLOW_GO_ADMIN_PORT:-9383}:9383
  es01:
    ports: !override
      - 127.0.0.1:${RAGFLOW_ELASTICSEARCH_PORT:-1200}:9200
  mysql:
    ports: !override
      - 127.0.0.1:${RAGFLOW_MYSQL_PORT:-5455}:3306
  minio:
    ports: !override
      - 127.0.0.1:${RAGFLOW_MINIO_PORT:-9000}:9000
      - 127.0.0.1:${RAGFLOW_MINIO_CONSOLE_PORT:-9001}:9001
  redis:
    ports: !override
      - 127.0.0.1:${RAGFLOW_REDIS_PORT:-6379}:6379

networks:
  chatflow_link:
    external: true
    name: ${CHATFLOW_RAGFLOW_NETWORK:-chatflow-ragflow-link}
