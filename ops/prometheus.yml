global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: chatflow-api
    metrics_path: /v1/ops/metrics
    bearer_token_file: /etc/prometheus/ops-api-key
    static_configs:
      - targets: [chatflow-api:3000]
